<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude for Inkscape</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,{{LOGO}}">
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --text: #1f1e1c;
    --muted: #6b6862;
    --border: #e3e0da;
    --accent: #b5532f;
    --accent-text: #ffffff;
    --user: #efe9df;
    --error: #b42318;
    --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --panel: #242320;
      --text: #ecebe8;
      --muted: #a29f98;
      --border: #3a3834;
      --accent: #e07a52;
      --accent-text: #1b1a18;
      --user: #33302b;
      --error: #f97066;
      --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header { position: relative; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .logo { width: 22px; height: 22px; }
  header h1, #doc { padding-right: 96px; }
  .tools { position: absolute; top: 10px; right: 16px; display: flex; gap: 6px; }
  .tools button { padding: 4px 10px; }
  #usage-toggle[aria-pressed="true"] { background: var(--user); }
  .usage.collapsed { display: none; }
  #doc { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .badge { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .badge::before { content: "●"; margin-right: 4px; color: var(--muted); }
  .badge.on::before { color: var(--ok); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 100%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); max-width: 85%; }
  .assistant { background: var(--panel); border: 1px solid var(--border); }
  .system { align-self: center; color: var(--muted); font-size: 12px; padding: 2px 8px; }
  .system.error { color: var(--error); }
  details { margin-top: 8px; color: var(--muted); font-size: 12px; white-space: normal; }
  details li.failed { color: var(--error); }
  .selection { margin-top: 6px; color: var(--muted); font-size: 12px; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .preview { display: block; margin-top: 10px; max-width: 100%; border: 1px solid var(--border); border-radius: 6px;
             background: #fff; }
  .empty { color: var(--muted); text-align: center; margin: auto; max-width: 280px; }
  form { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); display: flex;
         flex-direction: column; gap: 8px; }
  textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 8px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .hint { flex: 1; color: var(--muted); font-size: 12px; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: default; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button.icon { padding: 8px; }
  button[hidden] { display: none; }
  button svg { flex: none; }
  button.retry { display: flex; margin: 6px auto 0; padding: 2px 12px; font-size: 12px; }
  .usage { margin-top: 6px; display: grid; grid-template-columns: 1fr 90px; gap: 2px 10px; align-items: center;
           font-size: 12px; color: var(--muted); }
  .usage:empty { display: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ok); }
  .bar span.warn { background: #d08a1e; }
  .bar span.over { background: var(--error); }
  .images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .images img { max-width: 160px; max-height: 120px; border-radius: 6px; border: 1px solid var(--border); }
  #attached:empty { display: none; }
  #attached .chip { position: relative; }
  #attached img { width: 56px; height: 56px; object-fit: cover; }
  #attached button { position: absolute; top: -6px; right: -6px; padding: 2px; border-radius: 10px;
                     background: var(--panel); border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="data:image/svg+xml;base64,{{LOGO}}" alt="">Claude for Inkscape</h1>
  <div id="doc"></div>
  <div id="live" class="badge"></div>
  <div class="tools">
    <button type="button" class="secondary icon" id="usage-toggle" title="Context and usage limits"
            aria-label="Show context and usage limits" aria-pressed="false">{{icon:gauge}}</button>
    <button type="button" class="secondary icon" id="new" title="New chat: Claude forgets this drawing's conversation"
            aria-label="New chat">{{icon:square-pen}}</button>
  </div>
  <div id="usage" class="usage collapsed"></div>
</header>
<main id="log">
  <p class="empty" id="empty">Ask for a change, for example "add a soft drop shadow to the logo" or
    "center everything on the page". Claude keeps the whole conversation in mind.</p>
</main>
<form id="form">
  <div id="attached" class="images"></div>
  <textarea id="input" placeholder="What should Claude do? Paste or drop images to show Claude." autofocus></textarea>
  <div class="row">
    <span class="hint" id="hint">Enter to send, Shift+Enter for a new line</span>
    <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    <button type="button" class="secondary icon" id="image" aria-label="Attach images"
            title="Attach images: Claude sees them as context. You can also paste or drop them here.">{{icon:image-plus}}</button>
    <button type="button" class="secondary" id="undo" title="Undo Claude's last change to the drawing" hidden>{{icon:undo-2}} Undo</button>
    <button type="submit" class="primary" id="send">{{icon:send}} Send</button>
  </div>
</form>
<script>
  const TOKEN = "{{TOKEN}}";
  const ICONS = { retry: `{{icon:rotate-cw}}`, remove: `{{icon:x}}` };
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const hint = document.getElementById("hint");
  const buttons = ["send", "undo", "image", "new"].map((id) => document.getElementById(id));
  const attached = document.getElementById("attached");
  const MAX_BYTES = 5 * 1024 * 1024;
  let pending = [];

  async function api(path, body) {
    const response = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "content-type": "application/json", "x-chat-token": TOKEN },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) {
      throw Object.assign(new Error(data.error || response.statusText), { retry: data.retry, canUndo: data.can_undo });
    }
    return data;
  }

  function add(entry, preview) {
    document.getElementById("empty")?.remove();
    const div = document.createElement("div");
    div.className = `msg ${entry.role}` + (entry.text.startsWith("Error:") ? " error" : "");
    div.textContent = entry.text;

    if (entry.images && entry.images.length) {
      const images = document.createElement("div");
      images.className = "images";
      for (const image of entry.images) {
        const img = document.createElement("img");
        img.alt = image.name;
        img.title = image.name;
        img.src = image.url;
        images.append(img);
      }
      div.append(images);
    }

    if (entry.selection && entry.selection.length) {
      const selected = document.createElement("div");
      selected.className = "selection";
      selected.textContent = `Your selection: ${entry.selection.join(", ")}`;
      div.append(selected);
    }

    if (entry.steps && entry.steps.length) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = `${entry.steps.length} step${entry.steps.length === 1 ? "" : "s"}`;
      const list = document.createElement("ul");
      for (const step of entry.steps) {
        const item = document.createElement("li");
        item.textContent = `${step.tool}: ${step.summary}`;
        if (step.failed) item.className = "failed";
        list.append(item);
      }
      details.append(summary, list);
      div.append(details);
    }

    if (entry.retry) {
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "secondary retry";
      retry.innerHTML = ICONS.retry + " Retry";
      retry.addEventListener("click", () => {
        retry.remove();
        run("/api/retry", {}, "Trying again…");
      });
      div.append(retry);
    }

    if (preview) {
      const img = document.createElement("img");
      img.className = "preview";
      img.alt = "Preview of the drawing";
      img.src = `data:image/png;base64,${preview}`;
      div.append(img);
    }

    log.append(div);
    log.scrollTop = log.scrollHeight;
  }

  let lastUsage = null;

  function limitText(limit) {
    let text = limit.status === "rejected" ? `${limit.name}: reached` : `${limit.name}: ${Math.round(limit.used * 100)}% used`;
    if (!limit.resets_at) return text;
    const left = Math.max(0, Math.floor(limit.resets_at - Date.now() / 1000));
    const hours = Math.floor(left / 3600), minutes = Math.floor((left % 3600) / 60);
    const wait = left < 60 ? "less than a minute" : hours >= 24 ? `${Math.floor(hours / 24)} d ${hours % 24} h`
      : hours ? `${hours} h ${minutes} min` : `${minutes} min`;
    const when = new Date(limit.resets_at * 1000);
    const clock = when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const day = left >= 86400 ? when.toLocaleDateString([], { weekday: "short" }) + " " : "";
    return `${text}, resets in ${wait} (${day}${clock})`;
  }

  function showUsage(usage) {
    const box = document.getElementById("usage");
    if (!usage || (!usage.context_tokens && !usage.limits.length)) return;
    lastUsage = usage;
    box.replaceChildren();
    const rows = [[usage.context_text, usage.context_share]];
    usage.limits.forEach((limit) => rows.push([limitText(limit), limit.used]));
    for (const [text, share] of rows) {
      const label = document.createElement("span");
      label.textContent = text;
      const bar = document.createElement("div");
      bar.className = "bar";
      if (share !== null && share !== undefined) {
        const fill = document.createElement("span");
        fill.style.width = `${Math.round(share * 100)}%`;
        fill.className = share >= 0.9 ? "over" : share >= 0.7 ? "warn" : "";
        bar.append(fill);
      }
      box.append(label, bar);
    }
    document.getElementById("usage-toggle").title = rows.map(([text]) => text).join("\n");
  }

  function showUsagePanel(shown) {
    const toggle = document.getElementById("usage-toggle");
    toggle.setAttribute("aria-pressed", String(shown));
    document.getElementById("usage").classList.toggle("collapsed", !shown);
    try { localStorage.setItem("show-usage", shown ? "1" : "0"); } catch (error) {}
  }

  let usageShown = false;
  try { usageShown = localStorage.getItem("show-usage") === "1"; } catch (error) {}
  showUsagePanel(usageShown);
  document.getElementById("usage-toggle").addEventListener("click", () => {
    usageShown = !usageShown;
    showUsagePanel(usageShown);
  });

  function attach(files) {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      if (file.size > MAX_BYTES) {
        add({ role: "system", text: `Error: ${file.name} is larger than 5 MB. Use a smaller image.` });
        continue;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const url = reader.result;
        const image = { name: file.name || "pasted.png", url, data: url.slice(url.indexOf(",") + 1) };
        pending.push(image);
        const chip = document.createElement("div");
        chip.className = "chip";
        const img = document.createElement("img");
        img.src = url;
        img.title = image.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.innerHTML = ICONS.remove;
        remove.title = "Remove";
        remove.addEventListener("click", () => { pending = pending.filter((p) => p !== image); chip.remove(); });
        chip.append(img, remove);
        attached.append(chip);
      };
      reader.readAsDataURL(file);
    }
  }

  function busy(on, text) {
    buttons.forEach((b) => (b.disabled = on));
    hint.textContent = on ? text : "Enter to send, Shift+Enter for a new line";
  }

  function follow() {
    const live = document.createElement("div");
    live.className = "msg assistant";
    let shown = false;
    const timer = setInterval(async () => {
      try {
        const progress = await api("/api/progress");
        const last = progress.steps.slice(-3).map((step) => `${step.failed ? "✗" : "•"} ${step.tool}: ${step.summary}`);
        live.textContent = [progress.text, last.join("\n")].filter(Boolean).join("\n\n");
        showUsage(progress.usage);
        if (live.textContent && !shown) {
          log.append(live);
          shown = true;
        }
        log.scrollTop = log.scrollHeight;
      } catch (error) {}
    }, 500);
    return () => { clearInterval(timer); live.remove(); };
  }

  function showUndo(canUndo) {
    if (canUndo !== undefined) document.getElementById("undo").hidden = !canUndo;
  }

  async function run(path, body, waiting) {
    busy(true, waiting);
    const sending = path === "/api/message" || path === "/api/retry";
    document.querySelectorAll("button.retry").forEach((button) => button.remove());
    const stop = sending ? follow() : () => {};
    try {
      const result = await api(path, body);
      stop();
      add({ role: result.role || "system", text: result.text, steps: result.steps, selection: result.selection },
          result.preview);
      showUsage(result.usage);
      showUndo(result.can_undo);
    } catch (error) {
      stop();
      add({ role: "system", text: `Error: ${error.message}`, retry: sending && error.retry });
      showUndo(error.canUndo);
    } finally {
      busy(false);
      input.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    const images = pending;
    if (!text && !images.length) return;
    input.value = "";
    pending = [];
    attached.replaceChildren();
    add({ role: "user", text: text || "Here is an image.", images });
    run("/api/message", { text, images: images.map(({ name, data }) => ({ name, data })) },
        "Claude is working on the drawing…");
  });

  document.getElementById("image").addEventListener("click", () => document.getElementById("file").click());
  document.getElementById("file").addEventListener("change", (event) => {
    attach(event.target.files);
    event.target.value = "";
  });
  input.addEventListener("paste", (event) => {
    const files = [...(event.clipboardData?.files || [])];
    if (files.length) {
      event.preventDefault();
      attach(files);
    }
  });
  document.addEventListener("dragover", (event) => event.preventDefault());
  document.addEventListener("drop", (event) => {
    event.preventDefault();
    attach(event.dataTransfer?.files || []);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });

  setInterval(() => showUsage(lastUsage), 30000);

  document.getElementById("new").addEventListener("click", async () => {
    if (log.querySelector(".msg") && !confirm("Start a new chat? Claude forgets this conversation and its images.")) {
      return;
    }
    try {
      await api("/api/clear", {});
      log.replaceChildren();
      lastUsage = null;
      document.getElementById("usage").replaceChildren();
      add({ role: "system", text: "Started a new chat." });
    } catch (error) {
      add({ role: "system", text: `Error: ${error.message}` });
    }
  });

  document.getElementById("undo").addEventListener("click", () => run("/api/undo", {}, "Undoing…"));

  api("/api/state").then((state) => {
    document.getElementById("doc").textContent = state.document;
    const live = document.getElementById("live");
    showUndo(state.can_undo);
    live.className = state.live ? "badge on" : "badge";
    live.textContent = state.live
      ? "Synced with the open Inkscape window"
      : "Not synced: use File > Revert in Inkscape to see changes";
    state.transcript.forEach((entry, index) =>
      add({ ...entry, images: [], retry: state.can_retry && entry.retry && index === state.transcript.length - 1 }));
    showUsage(state.usage);
  });
</script>
</body>
</html>
